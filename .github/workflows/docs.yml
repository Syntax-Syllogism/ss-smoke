name: Docs site

on:
  push:
    branches: [master, release]
    paths: ['docs/**', 'docs-site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

jobs:
  docs:
    uses: Syntax-Syllogism/workflows/.github/workflows/docs-publish.yml@workflows/v1
    with:
      tool_slug: 'ss-smoke'
      public_repo: 'Syntax-Syllogism/ss-smoke'
      site_repo: 'Syntax-Syllogism/Syntax-Syllogism.github.io'
    secrets: inherit
